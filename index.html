<!doctype html>
<html lang="en" dir="ltr" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Thomas Erlich · Portfolio City</title>
    <meta name="description" content="Thomas Erlich's portfolio as an interactive 3D city: every building is a project, from AI automation and client work to research and chess tools." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Thomas Erlich · Portfolio City" />
    <meta property="og:description" content="An interactive 3D city where every building is a project." />
    <meta property="og:url" content="https://hathomas3.github.io/City-Res/" />
    <meta name="theme-color" content="#1b2438" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231b2438' stroke='%2338e8ff' stroke-width='4'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='700' font-size='26' fill='%23e9fbff' text-anchor='middle'%3ETE%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>document.documentElement.classList.replace('no-js', 'js');</script>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="#/" aria-label="Thomas Erlich">
          <span class="brand-badge" aria-hidden="true">TE</span>
          <span class="brand-text">
            <strong>Thomas Erlich</strong>
            <small data-i18n="subtitle">Every building is a project</small>
          </span>
        </a>
        <div class="search-wrap">
          <input id="search" type="search" autocomplete="off" data-i18n-ph="search" placeholder="Search projects or tech" aria-controls="search-results" />
          <ul id="search-results" class="search-results" hidden></ul>
        </div>
        <nav class="top-actions">
          <button id="btn-list" class="btn" type="button" data-i18n="listView">List view</button>
          <button id="btn-about" class="btn" type="button" data-i18n="about">About me</button>
          <button id="btn-theme" class="icon-btn" type="button">◐</button>
          <button id="btn-lang" class="btn btn-lang" type="button" data-i18n="language" lang="he">עברית</button>
        </nav>
      </header>

      <main class="frame">
        <div class="frame-chrome" aria-hidden="true">
          <span class="dots"><i></i><i></i><i></i></span>
          <span class="url">hathomas3.github.io/City-Res</span>
        </div>
        <div id="stage" class="stage">
          <canvas id="city" aria-label="Interactive 3D map of projects"></canvas>
          <div id="labels" class="labels"></div>
          <div id="tooltip" class="tooltip" hidden></div>
          <div class="map-controls">
            <button id="rot-left" class="icon-btn" type="button" data-i18n-title="rotateLeft">↺</button>
            <button id="rot-right" class="icon-btn" type="button" data-i18n-title="rotateRight">↻</button>
            <button id="zoom-out" class="icon-btn" type="button" data-i18n-title="zoomOut">−</button>
            <button id="zoom-in" class="icon-btn" type="button" data-i18n-title="zoomIn">+</button>
          </div>
          <button id="btn-list-mobile" class="btn btn-primary list-fab" type="button" data-i18n="listView">List view</button>
          <div id="hint" class="hint" role="status"></div>
          <aside id="card" class="card" hidden aria-live="polite"></aside>
          <section id="project" class="project" hidden></section>
          <div id="loading" class="loading" data-i18n="loading">Building the city…</div>
        </div>
      </main>
    </div>

    <div id="about" class="modal-backdrop" hidden></div>

    <section id="list-view" class="list-view"><!--STATIC_LIST--></section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
